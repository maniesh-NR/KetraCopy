[package]
name = "ketra-md3"
description = "A small Material Design 3 design system for egui (KetraCopy GUI shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Deliberately minimal: only the egui crate (which eframe re-exports), so the
# design system can be reused by any egui-based UI and stays easy to test
# headless.
[dependencies]
egui = "=0.28.1"
