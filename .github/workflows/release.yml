# Builds the NATIVE Windows (msvc, CLI + GUI) and macOS (CLI, both darwin
# targets) release binaries and attaches them to the GitHub release for a
# pushed v* tag.
#
# Single-producer rule (Gate 1, Strategist): every release asset has exactly
# ONE producer — Linux (.tar.gz, portable, .deb) and the source archives are
# built in the dev sandbox by scripts/package-dist.sh and attached at
# release-creation time; this workflow builds ONLY the Windows zips and the
# macOS tarballs (natively, so no mingw/osxcross toolchain is needed in the
# sandbox — see harness/evidence/2026-11-13-S7/ for the failed sandbox
# zigbuild attempt). Nothing overwrites the hash-baselined sandbox artifacts
# (harness/state/artifact-hashes.md).
#
# The macOS GUI is deferred in 1.2.x (the pinned egui 0.28 stack via
# objc2 0.4.1 does not compile against rustc >= 1.100 on macOS) — CLI only.
#
# Verify this workflow is green on main via workflow_dispatch BEFORE
# pushing a release tag.

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-windows:
    name: windows (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: x86_64 }
          - { target: i686-pc-windows-msvc,   arch: i686 }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (CLI + GUI)
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; d=json.load(sys.stdin); print([p for p in d['packages'] if p['name']=='ketra-cli'][0]['version'])")
          OUT="ketracopy-${VER}-windows-${{ matrix.arch }}"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/ketra.exe" "$OUT/"
          cp "target/${{ matrix.target }}/release/ketracopy-gui.exe" "$OUT/"
          cp README.md LICENSE ATTRIBUTIONS.md SHELL-INTEGRATION.md "$OUT/"
          7z a "${OUT}.zip" "$OUT" >/dev/null
      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ketracopy-*-windows-*.zip

  build-macos:
    name: macos (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI (GUI deferred on macOS)
        run: cargo build --release --locked -p ketra-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; d=json.load(sys.stdin); print([p for p in d['packages'] if p['name']=='ketra-cli'][0]['version'])")
          case "${{ matrix.target }}" in
            x86_64-*)  ARCH=x86_64 ;;
            aarch64-*) ARCH=aarch64 ;;
          esac
          OUT="ketracopy-${VER}-macos-${ARCH}"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/ketra" "$OUT/"
          cp LICENSE ATTRIBUTIONS.md SHELL-INTEGRATION.md "$OUT/"
          cp packaging/dist-README-macos.txt "$OUT/README-macos.txt"
          tar czf "${OUT}.tar.gz" "$OUT"
      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ketracopy-*-macos-*.tar.gz
