name: Build Android APK

# Builds the KetraCopy Android APK from source.
#
# STATUS (1.2.1): dispatch-only until the Android build is repaired — the
# Gradle build still references crates moved to `attic/` in 1.1.0
# (`crates/ketra-ffi`, `crates/ketra-net`) and the Kotlin side is being
# re-pointed at the `ketra-core` JNI bridge (`crates/ketra-core/src/jni.rs`).
# See docs/ANDROID.md and harness/state/ROADMAP.md (post-1.2.x roadmap).
#
# When repaired, re-enable the push/PR triggers below. The Gradle build
# shells out to `cargo ndk` (cross-compile the Rust engine for
# arm64-v8a / armeabi-v7a / x86_64) before compiling Kotlin. See
# docs/ANDROID.md for the full pipeline description.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.0.0 --locked

      - name: Install uniffi-bindgen-cli
        run: cargo install uniffi-bindgen-cli --version 0.28.3 --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Export ANDROID_NDK_HOME
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}/ndk/27.0.12077973" || {
            echo "NDK 27.0.12077973 not found under \$ANDROID_HOME"; exit 1
          }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Verify cargo-ndk
        run: cargo ndk --version

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ketracopy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  cargo-test:
    name: Rust workspace tests + integration suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets --locked

      - name: Integration suite
        run: bash scripts/test_integration.sh
